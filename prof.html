<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Conducteur de séance CodeCraft.">
    <title>CodeCraft — Conducteur professeur</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .teacher-page--wide { width: min(1060px, 100%); }
      .teacher-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 310px;
        gap: 26px;
        align-items: start;
      }
      .teacher-main { min-width: 0; }
      .teacher-sidebar {
        position: sticky;
        top: 20px;
      }
      .teacher-slot { border-left-color: var(--wood); }
      .teacher-slot-heading {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 18px;
      }
      .teacher-slot-heading .section-title { margin: 0; }
      .teacher-time {
        flex: 0 0 auto;
        padding: 7px 10px;
        border: 3px solid var(--ink);
        border-radius: var(--radius);
        background: var(--wood);
        box-shadow: 3px 3px 0 #383128;
        color: #fff;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }
      .teacher-list { margin: 0; padding-left: 23px; }
      .teacher-list li + li { margin-top: 9px; }
      .teacher-group {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 2px solid #d4cdbc;
      }
      .teacher-group:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
      .teacher-group h3 { margin: 0 0 10px; }
      .teacher-quote {
        margin: 18px 0 0;
        padding: 12px 15px;
        border-left: 6px solid var(--grass);
        background: #eef3df;
        font-weight: 700;
      }
      .connection-card {
        border-color: var(--stop-line);
        background: var(--stop-bg);
      }
      .connection-card .teacher-quote { border-left-color: var(--stop-line); background: #fff8eb; }
      .chat-example {
        margin: 8px 0 0;
        padding: 9px 11px;
        border: 2px solid var(--line);
        background: var(--paper);
        font-family: Consolas, "Courier New", monospace;
        font-size: .86rem;
      }
      .teacher-state-list {
        display: grid;
        gap: 9px;
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
      }
      .teacher-state-list li {
        padding: 9px 11px;
        border: 3px solid var(--line);
        background: var(--paper);
        font-weight: 800;
      }
      @media (max-width: 860px) {
        .teacher-layout { grid-template-columns: 1fr; }
        .teacher-sidebar { position: static; }
      }
      @media (max-width: 520px) {
        .teacher-slot-heading { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body data-page="teacher">
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <main id="main-content" class="site-shell" tabindex="-1"></main>
    <script src="lesson-data.js"></script>
    <script>
      (function () {
        "use strict";

        const data = window.CODECRAFT_DATA;
        const teacher = data.teacher;
        const main = document.getElementById("main-content");

        const make = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };

        const makeList = (items, className = "teacher-list") => {
          const list = make("ul", className);
          items.forEach((item) => list.append(make("li", "", item)));
          return list;
        };

        const addQuotes = (container, quotes) => {
          (quotes || []).forEach((quote) => container.append(make("blockquote", "teacher-quote", `« ${quote} »`)));
        };

        const pageHeader = make("header", "page-header page-header--compact");
        const brand = make("a", "brand", data.site.name);
        brand.href = "index.html";
        pageHeader.append(brand);

        const page = make("article", "teacher-page teacher-page--wide");
        const intro = make("header", "lesson-intro");
        intro.append(make("p", "eyebrow", data.site.name));
        intro.append(make("h1", "lesson-title", teacher.title));
        intro.append(make("p", "objective", teacher.subtitle));

        const layout = make("div", "teacher-layout");
        const timeline = make("div", "teacher-main");

        teacher.schedule.forEach((slot) => {
          const card = make("section", "content-card teacher-slot");
          const heading = make("header", "teacher-slot-heading");
          heading.append(make("time", "teacher-time", slot.time));
          heading.append(make("h2", "section-title", slot.title));
          card.append(heading);
          if (slot.items) card.append(makeList(slot.items));

          (slot.groups || []).forEach((group) => {
            const groupBlock = make("section", "teacher-group");
            groupBlock.append(make("h3", "", group.title));
            groupBlock.append(makeList(group.items));
            addQuotes(groupBlock, group.say);
            card.append(groupBlock);
          });

          addQuotes(card, slot.say);
          timeline.append(card);
        });

        const sidebar = make("aside", "teacher-sidebar");
        const connection = make("section", "content-card connection-card");
        connection.append(make("h2", "section-title", teacher.connection.title));
        connection.append(makeList(teacher.connection.items));
        connection.append(make("blockquote", "teacher-quote", `« ${teacher.connection.returnPrompt} »`));
        teacher.connection.chatExamples.forEach((example) => connection.append(make("p", "chat-example", example)));

        const notes = make("section", "content-card");
        notes.append(make("h2", "section-title", teacher.notes.title));
        notes.append(make("p", "", teacher.notes.description));
        notes.append(makeList(teacher.notes.states, "teacher-state-list"));

        const principles = make("section", "content-card");
        principles.append(make("h2", "section-title", teacher.principlesTitle));
        principles.append(makeList(teacher.principles));

        const studentLink = make("a", "button button--primary", teacher.studentLinkLabel);
        studentLink.href = "index.html";
        sidebar.append(connection, notes, principles, studentLink);
        layout.append(timeline, sidebar);
        page.append(intro, layout);
        main.append(pageHeader, page);
      })();
    </script>
  </body>
</html>
