name: CodeCraft checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, content and browser tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CODECRAFT_BROWSER_ARTIFACTS: ${{ github.workspace }}/browser-artifacts
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Check source formatting
        run: npm run format:check
      - name: Validate content and run Node tests
        run: npm test
      - name: Check Chrome installation
        shell: pwsh
        run: |
          $chromeExecutable = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chromeExecutable)) { throw 'Chrome executable not found on the runner.' }
          "CHROME_PATH=$chromeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run browser tests
        run: npm run test:browser
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-screenshots
          path: |
            browser-artifacts/**/*.png
            browser-artifacts/**/failure.json
            browser-artifacts/**/failure.html
            browser-artifacts/**/summary.json
            browser-artifacts/**/index.html
            browser-artifacts/**/output.log
          if-no-files-found: ignore
          retention-days: 7
