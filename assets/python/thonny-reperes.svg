<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420">
  <title>Éditeur et console</title>
  <desc>Exécuter lance le code écrit dans l’éditeur. Son résultat apparaît dans la console en dessous.</desc>
  <rect x="3" y="3" width="554" height="414" rx="4" fill="#f5edda" stroke="#37352d" stroke-width="6"/>
  <g font-family="Arial, sans-serif" fill="#242822">
    <rect x="20" y="20" width="245" height="52" fill="#e2eddf" stroke="#4f8045" stroke-width="3"/>
    <path d="M35 34 L35 58 L53 46 Z" fill="#4f8045"/>
    <text x="67" y="53" font-size="21" font-weight="bold">Exécuter</text>
    <rect x="280" y="20" width="260" height="52" fill="#f4e2d9" stroke="#aa5b40" stroke-width="3"/>
    <rect x="294" y="36" width="20" height="20" fill="#aa5b40"/>
    <text x="328" y="53" font-size="20" font-weight="bold">Arrêter</text>
    <rect x="20" y="91" width="520" height="140" fill="#fffdf5" stroke="#898574" stroke-width="2"/>
    <text x="35" y="120" font-size="23" font-weight="bold">1 · ÉDITEUR</text>
    <text x="35" y="201" font-family="monospace" font-size="22">print("Bonjour !")</text>
    <path d="M280 239 L280 259 M271 250 L280 260 L289 250" fill="none" stroke="#4f8045" stroke-width="4"/>
    <rect x="20" y="272" width="520" height="125" fill="#e8edf8" stroke="#3f69c6" stroke-width="2"/>
    <text x="35" y="302" font-size="23" font-weight="bold">2 · CONSOLE</text>
    <text x="35" y="376" font-family="monospace" font-size="22">Bonjour !</text>
  </g>
</svg>
