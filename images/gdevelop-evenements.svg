<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title"><title id="title">Deux conditions opposées, deux actions</title><rect width="800" height="250" rx="10" fill="#f5ece3"/><g font-family="sans-serif" fill="#503d68"><text x="34" y="36" font-size="19" font-weight="bold">CONDITION : ce que je teste</text><text x="474" y="36" font-size="19" font-weight="bold">ACTION : ce que je fais</text><path d="M24 51h752M24 134h752M440 51v164" stroke="#cbb9ca" fill="none"/><g font-size="20"><text x="34" y="101">Espace est maintenue</text><text x="474" y="101">Afficher Message</text><text x="34" y="184">Espace n’est pas maintenue</text><text x="474" y="184">Masquer Message</text></g><text x="34" y="232" font-size="16">Deux événements séparés. La deuxième condition est inversée.</text></g></svg>
