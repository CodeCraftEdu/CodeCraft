<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="title"><title id="title">Un objet, trois instances</title><rect width="800" height="230" rx="10" fill="#f5ece3"/><g font-family="sans-serif" fill="#503d68"><rect x="24" y="64" width="220" height="98" fill="#dfcfdd"/><text x="44" y="100" font-size="22" font-weight="bold">Objet Jeton</text><text x="44" y="130" font-size="16">Une image commune</text><path d="M254 114h38M292 48v135m0-135h40m-40 66h40m-40 69h40" fill="none" stroke="#a55d27" stroke-width="3"/><g font-size="18"><text x="352" y="54">Instance 1 : X = 300, Y = 150</text><text x="352" y="120">Instance 2 : X = 400, Y = 150</text><text x="352" y="189">Instance 3 : X = 500, Y = 150</text></g><text x="352" y="221" font-size="15">Chaque instance possède sa propre position.</text></g></svg>
