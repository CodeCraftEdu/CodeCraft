<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="title desc">
  <title id="title">Grille de repérage</title>
  <desc id="desc">Cinq colonnes de A à E et cinq lignes de 1 à 5. Un pion en C4 pointe vers le haut. Le haut indique le nord.</desc>
  <rect width="500" height="400" rx="8" fill="#fffdf5"/>
  <g fill="#29362e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="100" y="40">A</text><text x="160" y="40">B</text><text x="220" y="40">C</text><text x="280" y="40">D</text><text x="340" y="40">E</text>
    <text x="45" y="96">1</text><text x="45" y="156">2</text><text x="45" y="216">3</text><text x="45" y="276">4</text><text x="45" y="336">5</text>
  </g>
  <rect x="70" y="60" width="300" height="300" fill="#edf3e7" stroke="#597451" stroke-width="2"/>
  <path d="M130 60V360M190 60V360M250 60V360M310 60V360M70 120H370M70 180H370M70 240H370M70 300H370" fill="none" stroke="#8fa585" stroke-width="1.5"/>
  <rect x="191" y="241" width="58" height="58" fill="#fff0bd"/>
  <path d="M220 250L237 283L220 276L203 283Z" fill="#245c89" stroke="#123f61" stroke-width="2"/>
  <path d="M429 122V74M418 87L429 74L440 87" fill="none" stroke="#29362e" stroke-width="3"/>
  <text x="429" y="150" fill="#29362e" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">Nord</text>
  <text x="250" y="386" fill="#29362e" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Départ : C4, vers le nord</text>
</svg>
