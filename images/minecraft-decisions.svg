  <title id="title">Chemin et décisions</title>
  <desc id="desc">Grille A à E et 1 à 5. Le chemin passe par B5, B4, B3, C3, D3, D4 et D5. Départ B5 nord, but D5. Les autres cases sont bloquées.</desc>
