<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="title desc">
<title id="title">Quatre consultations du bouton</title><desc id="desc">Relâché : non, éteindre. Maintenu : oui, allumer. Toujours maintenu : oui, allumer. Relâché : non, éteindre.</desc>
<rect width="800" height="290" rx="12" fill="#eef3fa"/>
<g font-family="Arial,sans-serif" font-size="21" fill="#293f66">
<g font-weight="bold"><text x="25" y="35">Information lue</text><text x="350" y="35">Appuyé ?</text><text x="570" y="35">Action sur D8</text></g>
<text x="25" y="85">1. Relâché (0)</text><text x="350" y="85">Non</text><text x="570" y="85">Éteindre (LOW)</text>
<text x="25" y="140">2. Maintenu (1)</text><text x="350" y="140">Oui</text><text x="570" y="140">Allumer (HIGH)</text>
<text x="25" y="195">3. Toujours maintenu (1)</text><text x="350" y="195">Oui</text><text x="570" y="195">Allumer (HIGH)</text>
<text x="25" y="250">4. Relâché (0)</text><text x="350" y="250">Non</text><text x="570" y="250">Éteindre (LOW)</text>
</g><g stroke="#bbcce3"><path d="M25 105H775M25 160H775M25 215H775"/></g>
</svg>
